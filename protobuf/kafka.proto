syntax = "proto3";

package kafka;

option go_package = "github.com/Mershab99/moderntrader-libs/go/gen/kafkapb";

import "google/protobuf/timestamp.proto";

enum Side {
  BUY = 0;
  SELL = 1;
  PUT = 2;
  CALL = 3;
}
enum SECFilingType {
  Form4 = 0;
  Form13 = 1;
  //TD_AMERITRADE = 1;
  //ALPACA = 1;
}

enum Brokerage {
  INTERACTIVE_BROKERS = 0;
  //TD_AMERITRADE = 1;
  //ALPACA = 1;
}

