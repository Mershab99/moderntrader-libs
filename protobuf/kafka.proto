message SECFilingEvent {
    string id = 1;
    repeated string db_filing_ids = 2;
    google.protobuf.Timestamp timestamp = 8;
}

message OrderSignal {
    string id = 1;
    int32 strategy_id = 2;
    string ticker = 3;
    Side side = 4;
    google.protobuf.Timestamp timestamp = 5;
}

message OrderPlacement {
    string id = 1;
    int32 strategy_id = 2;
    string user_id = 3;
    int32 broker_account_id = 4;
    string ticker = 5;
    Side side = 6;
    float quantity = 7;
    google.protobuf.Timestamp timestamp = 8;
}

